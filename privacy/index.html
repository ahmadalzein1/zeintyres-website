<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <!-- The privacy policy for the Zein Tyres app: the page the App Store and
         Google Play listings link to, and Google Play's "delete your account"
         link (/privacy/#delete-account). Same app as the home page
         (src/App.jsx picks the page from the URL); this file only exists so
         /privacy/ is a real document with its own title and description. The
         icons, theme script and fonts mirror index.html - keep them in step. -->
    <link rel="icon" type="image/svg+xml" sizes="any" href="/favicon.svg" />
    <link rel="icon" type="image/png" sizes="192x192" href="/favicon-192.png" />
    <link rel="icon" type="image/png" sizes="48x48" href="/favicon-48.png" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="description" content="How the Zein Tyres app collects, uses and deletes your information, and how to delete your account." />
    <meta name="theme-color" content="#f5f5f5" media="(prefers-color-scheme: light)" />
    <meta name="theme-color" content="#0a0a0a" media="(prefers-color-scheme: dark)" />
    <meta name="format-detection" content="telephone=no" />
    <title>Privacy Policy - Zein Tyres</title>

    <!-- Keys and defaults must match readPref() in src/App.jsx. -->
    <script>
      try {
        var zt = document.documentElement
        var theme = localStorage.getItem('zt-theme')
        if (theme ? theme === 'dark' : matchMedia('(prefers-color-scheme: dark)').matches) {
          zt.setAttribute('data-theme', 'dark')
        }
        if (localStorage.getItem('zt-lang') === 'ar') {
          zt.dir = 'rtl'
          zt.lang = 'ar'
        }
      } catch (e) {}
    </script>

    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      rel="stylesheet"
      href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+Arabic:wght@400;500;600;700&family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap"
    />
    <link rel="canonical" href="https://www.zeintyres.com/privacy/" />

    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="Zein Tyres" />
    <meta property="og:url" content="https://www.zeintyres.com/privacy/" />
    <meta property="og:title" content="Privacy Policy - Zein Tyres" />
    <meta property="og:description" content="How the Zein Tyres app collects, uses and deletes your information." />
    <meta property="og:image" content="https://www.zeintyres.com/og-image.png" />
    <meta property="og:locale" content="en_US" />
    <meta property="og:locale:alternate" content="ar_LB" />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
    <script src="https://zein-tyres-ai-chatbot-production.up.railway.app/widget.js" defer></script>
  </body>
</html>
