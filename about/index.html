    <!-- The About page. Same app as the home page (src/App.jsx picks the page
         from the URL); this file only exists so /about/ is a real document
         with its own title, description and preview tags. The icons, theme
         script and fonts mirror index.html - keep the two in step. -->
    <link rel="icon" type="image/svg+xml" sizes="any" href="/favicon.svg" />
    <link rel="icon" type="image/png" sizes="192x192" href="/favicon-192.png" />

    <meta name="format-detection" content="telephone=no" />
    <title>About Abdul Karim Al Zein - Owner of Zein Tyres, Amchit</title>

    <!-- Keys and defaults must match readPref() in src/App.jsx. -->
    <script>
      try {
        var zt = document.documentElement
        var theme = localStorage.getItem('zt-theme')
        if (theme ? theme === 'dark' : matchMedia('(prefers-color-scheme: dark)').matches) {
          zt.setAttribute('data-theme', 'dark')
        }
        if (localStorage.getItem('zt-lang') === 'ar') {
          zt.dir = 'rtl'
          zt.lang = 'ar'
        }
      } catch (e) {}
    </script>
