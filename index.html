    <!-- Link previews (iMessage, WhatsApp, Facebook, LinkedIn). Scrapers never
         run our JS, so everything they show has to be static in this head. The
         image lives in public/ rather than src/assets/ so its URL stays stable:
         Vite content-hashes anything under src/, and these previews are cached
         hard by the platforms. Absolute URL is required - several scrapers
         reject relative paths. -->

    <meta property="og:url" content="https://www.zeintyres.com/" />
